<!-- 伺服器狀態小工具 DOM，取自 index.html 的 hero 區塊 -->
<div class="hero-stat hero-stat--live"
     id="server-status-widget"
     role="status"
     aria-live="polite"
     aria-label="查詢伺服器狀態中">
  <div class="hero-stat__live-header">
    <span class="status-dot status-dot--loading" id="server-status-dot" aria-hidden="true"></span>
    <span id="server-status-label" class="hero-stat__live-status">查詢中…</span>
  </div>
  <span class="hero-stat__value">
    <span id="server-online-count">—</span><span id="server-max-count" class="hero-stat__max"></span>
  </span>
  <span class="hero-stat__label">線上人數</span>
</div>
