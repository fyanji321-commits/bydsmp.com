<!-- 最小規則頁 DOM，供 rulesTabs 整合測試使用 -->
<div class="rules-tabs" role="tablist">
  <button class="rules-tab-btn active" data-tab="tab-basic" role="tab" aria-selected="true">基本規則</button>
  <button class="rules-tab-btn" data-tab="tab-world" role="tab" aria-selected="false">世界規則</button>
  <button class="rules-tab-btn" data-tab="tab-pvp" role="tab" aria-selected="false">PVP 規則</button>
</div>
<div id="tab-basic" class="rules-panel active" role="tabpanel" aria-hidden="false">Panel Basic</div>
<div id="tab-world" class="rules-panel" role="tabpanel" aria-hidden="true">Panel World</div>
<div id="tab-pvp" class="rules-panel" role="tabpanel" aria-hidden="true">Panel PVP</div>
